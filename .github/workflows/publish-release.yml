name: publish-aetherium-release

on:
  workflow_run:
    workflows: ["build-aetherium-real"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download successful build artifact
        uses: actions/download-artifact@v5
        with:
          name: aetherium-jar
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          if ! gh release view latest --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create latest \
              --repo "$GH_REPO" \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --title "Aetherium Latest Build" \
              --notes "Latest successful Aetherium build for Minecraft 26.2 / Fabric." \
              --latest
          fi
          gh release upload latest dist/aetherium-0.1.0.jar \
            --repo "$GH_REPO" \
            --clobber
